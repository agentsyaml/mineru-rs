[package]
name = "mineru"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust client, CLI, and API server for OpenAI-compatible MinerU document parsing"
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/mineru"
keywords = ["mineru", "document", "pdf", "vlm", "ocr"]
categories = ["command-line-utilities", "api-bindings"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "src/**",
    "/README.md",
    "vendor/mistralrs-core/**",
    "README.zh-CN.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "docs/usage.md",
    "docs/usage.en.md",
    "docs/compatibility.md",
    "tests/fixtures/pdf/minimal.pdf",
    "tests/fixtures/vlm/layout.txt",
    "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_model.json",
    "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_middle.json",
    "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list.json",
    "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list_v2.json",
    "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5.md",
    "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/cc9d646c918053bb628e661ed5772ce1ec4682952a90dc8e687eff8cb42f5df2.jpg",
    "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/c87758e60fb7ba943d6d429071e045b3ea6c5305534d4799a5797960ea34699e.jpg",
    "!tests/fixtures/input/README.md",
]

[[bin]]
name = "mineru"
path = "src/bin/mineru.rs"

[[bin]]
name = "mineru-vlm-api"
path = "src/bin/mineru-vlm-api.rs"

# Primary API server binary; `mineru-api.rs` is a thin `include!` alias of
# `mineru-vlm-api.rs` so the same server source ships under both names.
[[bin]]
name = "mineru-api"
path = "src/bin/mineru-api.rs"

[[bin]]
name = "mineru-office-convert"
path = "src/bin/mineru-office-convert.rs"
required-features = ["office"]

[[bin]]
name = "mineru-mistralrs"
path = "src/bin/mineru-mistralrs.rs"
required-features = ["mistralrs"]

[features]
default = []
office = ["dep:office2pdf"]
mistralrs = ["dep:mistralrs"]
mistralrs-cuda = ["mistralrs", "mistralrs/cuda"]
mistralrs-metal = ["mistralrs", "mistralrs/metal"]

[dependencies]
base64 = "0.23"
axum = { version = "0.8", features = ["multipart"] }
bytes = { version = "1", features = ["serde"] }
cap-std = "3"
cap-primitives = "3"
cap-fs-ext = "3"
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
indicatif = "0.18.6"
httpdate = "1"
md5 = "0.7"
mistralrs = { version = "=0.8.1", optional = true }
hayro = "=0.5.0"
hayro-jpeg2000 = { version = "=0.2.0", default-features = false }
hayro-write = "=0.4.0"
html-escape = "0.2"
lopdf = { version = "=0.44.0", default-features = false }
office2pdf = { version = "=0.6.5", optional = true }
pdf-writer = "=0.14.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
tiff = "=0.11.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "net", "process", "io-util", "signal", "io-std"] }
url = { version = "2", features = ["serde"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.41.0", default-features = false, features = ["encoding"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Fixed-minimal local patch of mistralrs-core 0.8.1 so generated MinerU layout
# tokens survive decoding (see vendor/mistralrs-core/PATCH.md). The `include`
# entry above documents intent, but cargo's nested-package detection excludes
# any directory containing a Cargo.toml from packaging, so a published crate
# cannot carry the vendored source; `cargo install --features mistralrs` is
# therefore not a supported install path (see PATCH.md "Packaging note").
# Drop the patch and this entry when upstream lands a request-level
# special-token switch.
[patch.crates-io]
mistralrs-core = { path = "vendor/mistralrs-core" }

# ponytail: workspace only hosts isolated native binding subcrates; root package
# default features/dependencies stay empty and unchanged. The vendored
# mistralrs-core is a patched path dependency, not a workspace member, so its
# heavy unit tests never join default test runs.
[workspace]
members = [".", "bindings/python", "bindings/node"]
exclude = ["vendor/mistralrs-core"]
resolver = "3"

[workspace.package]
version = "0.2.5"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/agentsyaml/mineru-rs"

# Dev-experience: dependencies rarely recompile, so optimize them even in dev
# builds (one-time cost, cached), and lightly optimize the test profile so the
# large suite (669+ tests) runs faster. Release profile intentionally untouched:
# the release pipeline owns its exact artifact contract.
[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1
