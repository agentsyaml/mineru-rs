[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "mineru-rs"
dynamic = ["version"]
description = "Native Python helpers for MinerU Rust"
readme = "../../README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/agentsyaml/mineru-rs"
Issues = "https://github.com/agentsyaml/mineru-rs/issues"

[project.scripts]
mineru = "mineru_rs._cli:main"
mineru-rs = "mineru_rs._cli:main"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "mineru_rs._native"
python-source = "python"
features = ["pyo3/extension-module"]
