[package]
name = "mineru-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "mineru_node"
crate-type = ["cdylib"]

[dependencies]
mineru = { path = "../.." }
napi = { version = "3.12", features = ["async"] }
napi-derive = "3.6"

[build-dependencies]
napi-build = "2.4"
