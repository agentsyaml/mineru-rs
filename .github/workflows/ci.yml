name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: |
          actionlint="$(go env GOPATH)/bin/actionlint"
          "$actionlint"
      - name: Run release script self-tests
        run: |
          python3 .github/scripts/verify_release.py self-test
          python3 .github/scripts/stage_binding_artifacts.py self-test
          python3 .github/scripts/attach_release_assets.py self-test
          python3 .github/scripts/check_cargo_audit.py self-test
          python3 .github/scripts/verify_container_release.py self-test
          python3 .github/scripts/container_smoke.py --self-check

  rust-msrv:
    name: Rust 1.89.0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Cache Cargo registry and git dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-cargo-audit-0.22.2-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-audit 0.22.2
        run: |
          if [ "$("$HOME/.cargo/bin/cargo-audit" --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
          test "$("$HOME/.cargo/bin/cargo-audit" --version)" = "cargo-audit 0.22.2"
      - name: Check reviewed cargo-audit exception
        run: |
          set +e
          "$HOME/.cargo/bin/cargo-audit" audit --json > "$RUNNER_TEMP/cargo-audit.json"
          audit_status=$?
          set -e
          python3 .github/scripts/check_cargo_audit.py check \
            --report "$RUNNER_TEMP/cargo-audit.json" --lockfile Cargo.lock
          printf '%s\n' "### cargo-audit exception" "" "Allowed: \`RUSTSEC-2026-0194\`, \`RUSTSEC-2026-0195\` (\`quick-xml\` only). Expires: \`2026-09-30\` UTC." >> "$GITHUB_STEP_SUMMARY"
          test "$audit_status" -eq 1
      - name: Check formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Test root package
        # Explicit feature set, not --all-features: the union of every optional
        # backend is not a single supported runtime configuration, so CI pins the
        # exact feature combo this runner is responsible for.
        run: cargo +1.89.0 test --locked -p mineru --all-targets --features office -- --test-threads=4
      - name: Run hermetic API process end-to-end tests
        run: |
          cargo +1.89.0 test --locked -p mineru --test mineru_api_server -- --ignored --test-threads=1
          cargo +1.89.0 test --locked -p mineru --features office --test mineru_api_server -- --exact canonical_client_consumes_real_api_server_zip_and_publishes_layout --ignored --test-threads=1
          cargo +1.89.0 test --locked -p mineru --features office --test office_convert_helper -- --exact helper_converts_self_authored_docx_pptx_and_xlsx --ignored --test-threads=1
      - name: Check root package without default features
        run: cargo +1.89.0 check --locked -p mineru --all-targets --no-default-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.89.0 doc --locked -p mineru --no-deps
      - name: Verify workspace metadata
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "metadata.json").read_text())
          packages = metadata["packages"]
          assert {package["name"] for package in packages} == {
              "mineru",
              "mineru-node",
              "mineru-python",
          }
          assert len(metadata["workspace_members"]) == 3
          assert all(package["name"] != "mineru-cli" for package in packages)
          assert all(
              target["name"] != "mineru-cli"
              for package in packages
              for target in package["targets"]
          )

          root = next(package for package in packages if package["name"] == "mineru")
          assert {target["name"] for target in root["targets"] if "lib" in target["kind"]} == {"mineru"}
          assert {target["name"] for target in root["targets"] if "bin" in target["kind"]} == {
              "mineru",
              "mineru-api",
              "mineru-office-convert",
          }
          PY
      - name: List and inspect package files
        run: |
          cargo +1.89.0 package -p mineru --list --locked > "$RUNNER_TEMP/mineru-package-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          files = set(Path(os.environ["RUNNER_TEMP"], "mineru-package-files.txt").read_text().splitlines())
          required = {
              "Cargo.lock",
              "Cargo.toml",
              "Cargo.toml.orig",
              "LICENSE-APACHE",
              "LICENSE-MIT",
              "README.md",
              "README.zh-CN.md",
              "docs/compatibility.md",
              "docs/usage.md",
              "docs/usage.en.md",
              "src/lib.rs",
              "tests/fixtures/pdf/minimal.pdf",
              "tests/fixtures/vlm/layout.txt",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_model.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_middle.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list_v2.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5.md",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/cc9d646c918053bb628e661ed5772ce1ec4682952a90dc8e687eff8cb42f5df2.jpg",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/c87758e60fb7ba943d6d429071e045b3ea6c5305534d4799a5797960ea34699e.jpg",
          }
          assert required <= files, sorted(required - files)
          assert any(path.startswith("src/") for path in files)
          allowed = required | {".cargo_vcs_info.json"}
          unexpected = {
              path
              for path in files
              if path not in allowed
              and not path.startswith("src/")
          }
          assert not unexpected, sorted(unexpected)
          PY
      - name: Package root crate
        run: cargo +1.89.0 package -p mineru --locked
      - name: Inspect and test packaged crate
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/package-metadata.json"
          PACKAGE_DIR="target/package/mineru-$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "package-metadata.json").read_text())
          packages = [package for package in metadata["packages"] if package["name"] == "mineru"]
          assert len(packages) == 1, packages
          print(packages[0]["version"])
          PY
          )"
          export PACKAGE_DIR
          python3 - <<'PY'
          import os
          from pathlib import Path

          package = Path(os.environ["PACKAGE_DIR"])
          required = {
              "Cargo.lock",
              "Cargo.toml",
              "Cargo.toml.orig",
              "LICENSE-APACHE",
              "LICENSE-MIT",
              "README.md",
              "README.zh-CN.md",
              "docs/compatibility.md",
              "docs/usage.md",
              "docs/usage.en.md",
              "src/lib.rs",
              "tests/fixtures/pdf/minimal.pdf",
              "tests/fixtures/vlm/layout.txt",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_model.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_middle.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list_v2.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5.md",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/cc9d646c918053bb628e661ed5772ce1ec4682952a90dc8e687eff8cb42f5df2.jpg",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/c87758e60fb7ba943d6d429071e045b3ea6c5305534d4799a5797960ea34699e.jpg",
          }
          missing = sorted(path for path in required if not (package / path).is_file())
          assert not missing, missing
          fixtures = {
              path.relative_to(package).as_posix()
              for path in (package / "tests/fixtures").rglob("*")
              if path.is_file()
          }
          assert fixtures == {path for path in required if path.startswith("tests/fixtures/")}
          assert Path(f"{package}.crate").is_file()
          PY
          cargo +1.89.0 test --manifest-path "$PACKAGE_DIR/Cargo.toml" --lib --locked -- --test-threads=1
      - name: Dry-run crates.io publication
        run: cargo +1.89.0 publish -p mineru --dry-run --locked

  windows-path-safety-msrv:
    name: Windows path safety, Rust 1.89.0
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal && rustup target add --toolchain 1.89.0 aarch64-pc-windows-msvc
      - name: Test Windows path safety
        run: |
          cargo +1.89.0 test --locked -p mineru --lib --target x86_64-pc-windows-msvc command::direct::tests -- --test-threads=4
          cargo +1.89.0 test --locked -p mineru --lib --target x86_64-pc-windows-msvc official_output::tests -- --test-threads=4
          cargo +1.89.0 test --locked -p mineru --lib --target x86_64-pc-windows-msvc mineru_api::archive::tests -- --test-threads=4
      - name: Test Windows Office helper containment and conversion
        run: |
          cargo +1.89.0 test --locked -p mineru --features office --target x86_64-pc-windows-msvc --test office_convert_helper -- --test-threads=1
          cargo +1.89.0 test --locked -p mineru --features office --target x86_64-pc-windows-msvc --test office_convert_helper -- --exact helper_converts_self_authored_docx_pptx_and_xlsx --ignored --test-threads=1
      - name: Check ARM64 Windows tests
        run: |
          cargo +1.89.0 check --locked -p mineru --tests --target aarch64-pc-windows-msvc
          cargo +1.89.0 check --locked -p mineru --features office --bin mineru-office-convert --target aarch64-pc-windows-msvc

  python-binding:
    name: Python 3.9 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: Install Rust 1.89.0 target
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0 && rustup target add x86_64-unknown-linux-gnu
      - name: Build locked manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: x86_64-unknown-linux-gnu
          manylinux: "2014"
          rust-toolchain: 1.89.0
          args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist/python
      - name: Verify wheel
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/wheel-metadata.json"
          MINERU_VERSION="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "wheel-metadata.json").read_text())
          packages = [package for package in metadata["packages"] if package["name"] == "mineru"]
          assert len(packages) == 1, packages
          print(packages[0]["version"])
          PY
          )"
          export MINERU_VERSION
          python .github/scripts/verify_release.py wheel --directory dist/python \
            --version "$MINERU_VERSION" --count 1 --platform manylinux-x64
      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/python/*.whl
          python - <<'PY'
          import mineru_rs

          assert mineru_rs.canonical_stem("a bad/pdf") == "a bad_pdf"
          assert mineru_rs.validate_pdf_options(0, None, True, True, True) is True
          PY
          python -m unittest discover -s bindings/python/tests -p 'test_*.py'

  node-binding:
    name: Node 18–24 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Install npm 12.0.2
        run: npm install --global npm@12.0.2
      - name: Install Node dependencies
        run: npm ci
      - name: Install Rust 1.89.0 target
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0 && rustup target add x86_64-unknown-linux-gnu
      - name: Build Linux x64 binding
        run: |
          npx --no-install napi build --release --platform --target x86_64-unknown-linux-gnu -- --locked
          git restore --source=HEAD -- index.js
          git diff --exit-code -- index.d.ts
      - name: Stage exact current-build platform package
        run: |
          python ../../.github/scripts/stage_binding_artifacts.py stage-npm \
            --target x86_64-unknown-linux-gnu \
            --addon mineru.linux-x64-gnu.node \
            --package-dir staged/linux-x64-gnu --root-package-json package.json
          python ../../.github/scripts/stage_binding_artifacts.py inspect-npm \
            --target x86_64-unknown-linux-gnu \
            --package-dir staged/linux-x64-gnu --root-package-json package.json
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("staged/linux-x64-gnu")
          destination = Path("node_modules/@alexsun-top/mineru-linux-x64-gnu")
          shutil.rmtree(destination, ignore_errors=True)
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, destination)
          Path("mineru.linux-x64-gnu.node").unlink()
          PY
      - name: Test current-build platform package on Node 24
        run: |
          npm test
      - name: Set up Node 18.20.8
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.8
      - name: Test on Node 18
        run: npm test

  container-smoke:
    name: Container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build cached local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: mineru:ci
          cache-from: type=gha,scope=ci-container
          cache-to: type=gha,mode=max,scope=ci-container
      - name: Smoke canonical CLI
        run: docker run --rm mineru:ci mineru --version
      - name: Smoke API task lifecycle
        run: python3 .github/scripts/container_smoke.py --image mineru:ci --pdf tests/fixtures/pdf/minimal.pdf
