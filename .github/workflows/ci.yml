name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: |
          actionlint="$(go env GOPATH)/bin/actionlint"
          "$actionlint"

  rust-msrv:
    name: Rust 1.89.0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Test root package
        run: cargo +1.89.0 test --locked -p mineru --all-targets -- --test-threads=1
      - name: Check root package without default features
        run: cargo +1.89.0 check --locked -p mineru --all-targets --no-default-features
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.89.0 doc --locked -p mineru --no-deps
      - name: Verify workspace metadata
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "metadata.json").read_text())
          packages = metadata["packages"]
          assert {package["name"] for package in packages} == {
              "mineru",
              "mineru-node",
              "mineru-python",
          }
          assert len(metadata["workspace_members"]) == 3
          assert all(package["name"] != "mineru-cli" for package in packages)
          assert all(
              target["name"] != "mineru-cli"
              for package in packages
              for target in package["targets"]
          )

          root = next(package for package in packages if package["name"] == "mineru")
          assert {target["name"] for target in root["targets"] if "lib" in target["kind"]} == {"mineru"}
          assert {target["name"] for target in root["targets"] if "bin" in target["kind"]} == {
              "mineru",
              "mineru-api",
              "mineru-office-convert",
              "mineru-vlm",
              "mineru-vlm-api",
          }
          PY
      - name: List and inspect package files
        run: |
          cargo +1.89.0 package -p mineru --list --locked > "$RUNNER_TEMP/mineru-package-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          files = set(Path(os.environ["RUNNER_TEMP"], "mineru-package-files.txt").read_text().splitlines())
          required = {
              "Cargo.lock",
              "Cargo.toml",
              "Cargo.toml.orig",
              "LICENSE-APACHE",
              "LICENSE-MIT",
              "README.md",
              "docs/compatibility.md",
              "docs/usage.md",
              "src/lib.rs",
              "tests/fixtures/pdf/minimal.pdf",
              "tests/fixtures/vlm/layout.txt",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_model.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_middle.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list_v2.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5.md",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/cc9d646c918053bb628e661ed5772ce1ec4682952a90dc8e687eff8cb42f5df2.jpg",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/c87758e60fb7ba943d6d429071e045b3ea6c5305534d4799a5797960ea34699e.jpg",
          }
          assert required <= files, sorted(required - files)
          assert any(path.startswith("src/") for path in files)
          allowed = required | {".cargo_vcs_info.json"}
          unexpected = {
              path
              for path in files
              if path not in allowed
              and not path.startswith("src/")
          }
          assert not unexpected, sorted(unexpected)
          PY
      - name: Package root crate
        run: cargo +1.89.0 package -p mineru --locked
      - name: Inspect and test packaged crate
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/package-metadata.json"
          PACKAGE_DIR="target/package/mineru-$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "package-metadata.json").read_text())
          packages = [package for package in metadata["packages"] if package["name"] == "mineru"]
          assert len(packages) == 1, packages
          print(packages[0]["version"])
          PY
          )"
          export PACKAGE_DIR
          python3 - <<'PY'
          import os
          from pathlib import Path

          package = Path(os.environ["PACKAGE_DIR"])
          required = {
              "Cargo.lock",
              "Cargo.toml",
              "Cargo.toml.orig",
              "LICENSE-APACHE",
              "LICENSE-MIT",
              "README.md",
              "docs/compatibility.md",
              "docs/usage.md",
              "src/lib.rs",
              "tests/fixtures/pdf/minimal.pdf",
              "tests/fixtures/vlm/layout.txt",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_model.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_middle.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5_content_list_v2.json",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/2410.21169v5.md",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/cc9d646c918053bb628e661ed5772ce1ec4682952a90dc8e687eff8cb42f5df2.jpg",
              "tests/fixtures/official/arxiv_2410.21169v5/vlm/images/c87758e60fb7ba943d6d429071e045b3ea6c5305534d4799a5797960ea34699e.jpg",
          }
          missing = sorted(path for path in required if not (package / path).is_file())
          assert not missing, missing
          fixtures = {
              path.relative_to(package).as_posix()
              for path in (package / "tests/fixtures").rglob("*")
              if path.is_file()
          }
          assert fixtures == {path for path in required if path.startswith("tests/fixtures/")}
          assert Path(f"{package}.crate").is_file()
          PY
          cargo +1.89.0 test --manifest-path "$PACKAGE_DIR/Cargo.toml" --lib --locked -- --test-threads=1
      - name: Dry-run crates.io publication
        run: cargo +1.89.0 publish -p mineru --dry-run --locked

  windows-path-safety-msrv:
    name: Windows path safety, Rust 1.89.0
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal && rustup target add --toolchain 1.89.0 aarch64-pc-windows-msvc
      - name: Test Windows path safety
        run: |
          cargo +1.89.0 test --locked -p mineru --lib --target x86_64-pc-windows-msvc command::direct::tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mineru --lib --target x86_64-pc-windows-msvc official_output::tests -- --test-threads=1
          cargo +1.89.0 test --locked -p mineru --lib --target x86_64-pc-windows-msvc mineru_api::archive::tests -- --test-threads=1
      - name: Check ARM64 Windows tests
        run: cargo +1.89.0 check --locked -p mineru --tests --target aarch64-pc-windows-msvc

  rust-all-features:
    name: Rust stable, all features
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test all features
        run: cargo +stable test --locked -p mineru --all-targets --all-features -- --test-threads=1
      - name: Clippy
        run: cargo +stable clippy --locked -p mineru --all-targets --all-features

  rust-slow-e2e:
    name: Rust stable, slow E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Run ignored end-to-end tests
        run: cargo test --locked -p mineru --all-targets --all-features -- --ignored --skip real_pdf_selected_200_produces_official_preview --test-threads=1

  python-binding:
    name: Python 3.9 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - name: Install Rust 1.89.0 target
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0 && rustup target add x86_64-unknown-linux-gnu
      - name: Prepare same-manylinux helper staging hook
        run: |
          cat > .github/scripts/ci-stage-python-helper.sh <<'SH'
          #!/bin/sh
          set -eux
          cargo build --locked --release --bin mineru-office-convert --features office --target x86_64-unknown-linux-gnu
          helper="${CARGO_TARGET_DIR:-target}/x86_64-unknown-linux-gnu/release/mineru-office-convert"
          python3 .github/scripts/stage_binding_artifacts.py stage-python \
            --target x86_64-unknown-linux-gnu \
            --helper "$helper" \
            --package-dir bindings/python/python/mineru_rs
          SH
          chmod 755 .github/scripts/ci-stage-python-helper.sh
      - name: Build locked manylinux wheel with same-target helper
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: x86_64-unknown-linux-gnu
          manylinux: "2014"
          rust-toolchain: 1.89.0
          before-script-linux: .github/scripts/ci-stage-python-helper.sh
          args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist/python
      - name: Inspect same-target staged helper
        run: python .github/scripts/stage_binding_artifacts.py inspect-python --target x86_64-unknown-linux-gnu --package-dir bindings/python/python/mineru_rs
      - name: Verify wheel
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/wheel-metadata.json"
          MINERU_VERSION="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "wheel-metadata.json").read_text())
          packages = [package for package in metadata["packages"] if package["name"] == "mineru"]
          assert len(packages) == 1, packages
          print(packages[0]["version"])
          PY
          )"
          export MINERU_VERSION
          python .github/scripts/verify_release.py wheel --directory dist/python \
            --version "$MINERU_VERSION" --count 1 --platform manylinux-x64
      - name: Install and smoke-test wheel
        env:
          MINERU_RUN_OFFICE_E2E: "1"
        run: |
          python -m pip install --force-reinstall dist/python/*.whl
          python - <<'PY'
          import mineru_rs

          assert mineru_rs.canonical_stem("a bad/pdf") == "a_bad_pdf"
          assert mineru_rs.validate_pdf_options(0, None, True, True, True) is True
          PY
          python -m unittest discover -s bindings/python/tests -p 'test_*.py'

  node-binding:
    name: Node 18–24 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install npm 12.0.1
        run: npm install --global npm@12.0.1
      - name: Install Node dependencies
        run: npm ci
      - name: Install Rust 1.89.0 target
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0 && rustup target add x86_64-unknown-linux-gnu
      - name: Build same-target Office helper
        run: cargo +1.89.0 build --locked --release -p mineru --bin mineru-office-convert --features office --target x86_64-unknown-linux-gnu
      - name: Build Linux x64 binding
        run: npx --no-install napi build --release --platform --target x86_64-unknown-linux-gnu -- --locked
      - name: Stage exact current-build platform package
        run: |
          python ../../.github/scripts/stage_binding_artifacts.py stage-npm \
            --target x86_64-unknown-linux-gnu \
            --addon mineru.linux-x64-gnu.node \
            --helper ../../target/x86_64-unknown-linux-gnu/release/mineru-office-convert \
            --package-dir staged/linux-x64-gnu --root-package-json package.json
          python ../../.github/scripts/stage_binding_artifacts.py inspect-npm \
            --target x86_64-unknown-linux-gnu \
            --package-dir staged/linux-x64-gnu --root-package-json package.json
          python - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("staged/linux-x64-gnu")
          destination = Path("node_modules/@alexsun-top/mineru-linux-x64-gnu")
          shutil.rmtree(destination, ignore_errors=True)
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, destination)
          Path("mineru.linux-x64-gnu.node").unlink()
          PY
      - name: Test current-build platform package on Node 24
        env:
          MINERU_RUN_OFFICE_E2E: "1"
        run: |
          npm test
      - name: Set up Node 18.20.8
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.8
      - name: Test on Node 18
        run: node __test__/smoke.test.js
