name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Lint workflows
        run: "$(go env GOPATH)/bin/actionlint"

  rust-msrv:
    name: Rust 1.89.0
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Test root package
        run: cargo +1.89.0 test --locked -p mineru --all-targets -- --test-threads=1
      - name: Test root package without default features
        run: cargo +1.89.0 test --locked -p mineru --all-targets --no-default-features -- --test-threads=1
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.89.0 doc --locked -p mineru --no-deps
      - name: Verify workspace metadata
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/metadata.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "metadata.json").read_text())
          packages = metadata["packages"]
          assert {package["name"] for package in packages} == {
              "mineru",
              "mineru-node",
              "mineru-python",
          }
          assert len(metadata["workspace_members"]) == 3
          assert all(package["name"] != "mineru-cli" for package in packages)
          assert all(
              target["name"] != "mineru-cli"
              for package in packages
              for target in package["targets"]
          )

          root = next(package for package in packages if package["name"] == "mineru")
          assert {target["name"] for target in root["targets"] if "lib" in target["kind"]} == {"mineru"}
          assert {target["name"] for target in root["targets"] if "bin" in target["kind"]} == {
              "mineru",
              "mineru-api",
              "mineru-office-convert",
              "mineru-vlm",
              "mineru-vlm-api",
          }
          PY
      - name: List and inspect package files
        run: |
          cargo +1.89.0 package -p mineru --list --locked > "$RUNNER_TEMP/mineru-package-files.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path

          files = set(Path(os.environ["RUNNER_TEMP"], "mineru-package-files.txt").read_text().splitlines())
          required = {
              "Cargo.lock",
              "Cargo.toml",
              "Cargo.toml.orig",
              "LICENSE-APACHE",
              "LICENSE-MIT",
              "README.md",
              "docs/compatibility.md",
              "docs/usage.md",
              "src/lib.rs",
              "tests/fixtures/pdf/minimal.pdf",
          }
          assert required <= files, sorted(required - files)
          assert any(path.startswith("src/") for path in files)
          assert any(path.startswith("tests/fixtures/") for path in files)
          allowed = required | {".cargo_vcs_info.json"}
          unexpected = {
              path
              for path in files
              if path not in allowed
              and not path.startswith("src/")
              and not path.startswith("tests/fixtures/")
          }
          assert not unexpected, sorted(unexpected)
          PY
      - name: Package root crate
        run: cargo +1.89.0 package -p mineru --locked
      - name: Inspect and test packaged crate
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/package-metadata.json"
          export PACKAGE_DIR="target/package/mineru-$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "package-metadata.json").read_text())
          packages = [package for package in metadata["packages"] if package["name"] == "mineru"]
          assert len(packages) == 1, packages
          print(packages[0]["version"])
          PY
          )"
          python3 - <<'PY'
          import os
          from pathlib import Path

          package = Path(os.environ["PACKAGE_DIR"])
          required = {
              "Cargo.lock",
              "Cargo.toml",
              "Cargo.toml.orig",
              "LICENSE-APACHE",
              "LICENSE-MIT",
              "README.md",
              "docs/compatibility.md",
              "docs/usage.md",
              "src/lib.rs",
              "tests/fixtures/pdf/minimal.pdf",
          }
          missing = sorted(path for path in required if not (package / path).is_file())
          assert not missing, missing
          assert Path(f"{package}.crate").is_file()
          PY
          cargo +1.89.0 test --manifest-path "$PACKAGE_DIR/Cargo.toml" --lib --locked
      - name: Dry-run crates.io publication
        run: cargo +1.89.0 publish -p mineru --dry-run --locked

  rust-all-features:
    name: Rust stable, all features
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test all features
        run: cargo +stable test --locked -p mineru --all-targets --all-features -- --test-threads=1
      - name: Clippy
        run: cargo +stable clippy --locked -p mineru --all-targets --all-features

  python-binding:
    name: Python 3.9 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.9"
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Install Python build and test tools
        run: python -m pip install --disable-pip-version-check maturin==1.14.1 pytest==8.4.2
      - name: Build wheel
        run: python -m maturin build --release --locked --manifest-path bindings/python/Cargo.toml --out dist/python
      - name: Verify wheel
        run: |
          cargo +1.89.0 metadata --locked --format-version 1 --no-deps > "$RUNNER_TEMP/wheel-metadata.json"
          export MINERU_VERSION="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["RUNNER_TEMP"], "wheel-metadata.json").read_text())
          packages = [package for package in metadata["packages"] if package["name"] == "mineru"]
          assert len(packages) == 1, packages
          print(packages[0]["version"])
          PY
          )"
          python - <<'PY'
          from fnmatch import fnmatch
          import os
          from pathlib import Path

          wheels = list(Path("dist/python").glob("*.whl"))
          assert len(wheels) == 1, [wheel.name for wheel in wheels]
          name = wheels[0].name
          assert fnmatch(name, f"mineru_rs-{os.environ['MINERU_VERSION']}-cp39-abi3-*.whl"), name
          platform = name.removesuffix(".whl").rsplit("-", 1)[1]
          assert not any(tag.startswith("linux_") for tag in platform.split(".")), platform
          PY
      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/python/*.whl
          python - <<'PY'
          import mineru_rs

          assert mineru_rs.canonical_stem("a bad/pdf") == "a_bad_pdf"
          assert mineru_rs.validate_pdf_options(0, None, True, True, True) is True
          PY
          python -m pytest -q bindings/python/tests/test_smoke.py

  node-binding:
    name: Node 18–24 binding
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node 24.18.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Install npm 12.0.1
        run: npm install --global npm@12.0.1
      - name: Install Node dependencies
        run: npm ci
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Build Linux x64 binding
        run: npx --no-install napi build --release --platform --target x86_64-unknown-linux-gnu -- --locked
      - name: Verify native artifact and test on Node 24
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const artifacts = fs.readdirSync('.').filter((name) => name.endsWith('.node'));
          if (artifacts.length !== 1 || artifacts[0] !== 'mineru.linux-x64-gnu.node') {
            throw new Error(`unexpected native artifacts: ${artifacts.join(', ')}`);
          }
          NODE
          npm test
      - name: Set up Node 18.20.8
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.8
      - name: Test on Node 18
        run: node __test__/smoke.test.js
