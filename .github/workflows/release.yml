name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable package version (X.Y.Z)
        required: true
        type: string
      commit:
        description: Full commit SHA (normalized to lowercase)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Authoritative immutable release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          COMMIT="${INPUT_COMMIT,,}"
          [[ "$INPUT_COMMIT" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo 'commit must be a full hexadecimal SHA' >&2; exit 1; }
          test "${#COMMIT}" = 40
          test "$GITHUB_SHA" = "$COMMIT" || { echo "workflow ref $GITHUB_SHA does not equal requested commit $COMMIT" >&2; exit 1; }
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'version must be stable X.Y.Z' >&2; exit 1; }
          tag="v$VERSION"
          absent() {
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/api-body" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' "$1")"
            test "$status" = 404 || { echo "expected HTTP 404 from $1, got $status" >&2; cat "$RUNNER_TEMP/api-body" >&2; exit 1; }
          }
          absent "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          absent "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check out immutable requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Cache Cargo audit dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
          key: release-cargo-audit-${{ runner.os }}-${{ runner.arch }}-rust-1.89.0-cargo-audit-0.22.2-${{ hashFiles('Cargo.lock') }}
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Install cargo-audit 0.22.2
        run: |
          if [ "$("$HOME/.cargo/bin/cargo-audit" --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]; then
            cargo install cargo-audit --version 0.22.2 --locked --force
          fi
          test "$("$HOME/.cargo/bin/cargo-audit" --version)" = "cargo-audit 0.22.2"
      - name: Check reviewed cargo-audit exception
        run: |
          set +e
          "$HOME/.cargo/bin/cargo-audit" audit --json > "$RUNNER_TEMP/cargo-audit.json"
          audit_status=$?
          set -e
          python3 .github/scripts/check_cargo_audit.py check \
            --report "$RUNNER_TEMP/cargo-audit.json" --lockfile Cargo.lock --manifest Cargo.toml
          printf '%s\n' "### cargo-audit exception" "" "Allowed: \`RUSTSEC-2026-0194\`, \`RUSTSEC-2026-0195\` (\`quick-xml\` only). Expires: \`2026-09-30\` UTC." >> "$GITHUB_STEP_SUMMARY"
          test "$audit_status" -eq 1
      - name: Verify immutable release identity and package metadata
        id: identity
        run: |
          cargo metadata --locked --no-deps --format-version 1 > cargo-metadata.json
          version="$(python .github/scripts/verify_release.py identity \
            --metadata cargo-metadata.json --version '${{ inputs.version }}' --sha '${{ steps.preflight.outputs.commit }}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${{ steps.preflight.outputs.commit }}" >> "$GITHUB_OUTPUT"

  crate-package:
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Package and verify crate
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          cargo package -p mineru --locked
          python .github/scripts/verify_release.py crate --directory target/package --version "$VERSION" \
            --extract "$RUNNER_TEMP/crate-unpacked"
          cargo test --manifest-path "$RUNNER_TEMP/crate-unpacked/mineru-$VERSION/Cargo.toml" \
            --lib --locked -- --test-threads=1
          cargo install --path "$RUNNER_TEMP/crate-unpacked/mineru-$VERSION" --root "$RUNNER_TEMP/crate-install" \
            --locked --features office --bins
          "$RUNNER_TEMP/crate-install/bin/mineru" --help
      - name: Upload crate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-package
          path: target/package/mineru-${{ needs.identity.outputs.version }}.crate
          if-no-files-found: error

  python-wheel:
    needs: identity
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            helper: mineru-office-convert
            python: "3.9"
            python-arch: x64
            slot: manylinux-x64
            deployment: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            helper: mineru-office-convert
            python: 3.14.6
            python-arch: arm64
            slot: manylinux-arm64
            deployment: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            helper: mineru-office-convert
            python: 3.14.6
            python-arch: x64
            slot: macos-x64
            deployment: "10.12"
          - runner: macos-15
            target: aarch64-apple-darwin
            helper: mineru-office-convert
            python: 3.14.6
            python-arch: arm64
            slot: macos-arm64
            deployment: "11.0"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            helper: mineru-office-convert.exe
            python: 3.14.6
            python-arch: x64
            slot: windows-x64
            deployment: ""
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python-arch }}
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0 && rustup target add ${{ matrix.target }}
      - name: Prepare same-manylinux helper staging hook
        if: runner.os == 'Linux'
        run: |
          cat > .github/scripts/release-stage-python-helper.sh <<'SH'
          #!/bin/sh
          set -eux
          cargo build --locked --release --bin mineru-office-convert --features office --target ${{ matrix.target }}
          helper="${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/${{ matrix.helper }}"
          python3 .github/scripts/stage_binding_artifacts.py stage-python \
            --target ${{ matrix.target }} --helper "$helper" \
            --package-dir bindings/python/python/mineru_rs
          SH
          chmod 755 .github/scripts/release-stage-python-helper.sh
      - name: Build and stage same-target native helper
        if: runner.os != 'Linux'
        run: |
          cargo build --locked --release --bin mineru-office-convert --features office --target ${{ matrix.target }}
          python .github/scripts/stage_binding_artifacts.py stage-python --target ${{ matrix.target }} --helper target/${{ matrix.target }}/release/${{ matrix.helper }} --package-dir bindings/python/python/mineru_rs
      - name: Build locked manylinux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: "2014"
          rust-toolchain: 1.89.0
          before-script-linux: .github/scripts/release-stage-python-helper.sh
          args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist
      - name: Build locked native wheel
        if: runner.os != 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          rust-toolchain: 1.89.0
          args: --release --locked --manifest-path bindings/python/Cargo.toml --out dist
      - name: Inspect exact same-target staged helper
        run: python .github/scripts/stage_binding_artifacts.py inspect-python --target ${{ matrix.target }} --package-dir bindings/python/python/mineru_rs
      - name: Verify, install, and smoke wheel
        env:
          MINERU_RUN_OFFICE_E2E: "1"
        run: |
          python .github/scripts/verify_release.py wheel --directory dist --version "${{ needs.identity.outputs.version }}" --count 1 --platform "${{ matrix.slot }}"
          python -c "import os,venv; venv.create(os.path.join(os.environ['RUNNER_TEMP'],'wheel-venv'),with_pip=True)"
          python -c "import glob,os,pathlib,subprocess; root=pathlib.Path(os.environ['RUNNER_TEMP'])/'wheel-venv'; py=root/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); wheels=glob.glob(os.path.abspath('dist/*.whl')); assert len(wheels)==1,wheels; subprocess.check_call([str(py),'-m','pip','install',wheels[0]])"
          python -c "import os,pathlib,subprocess; root=pathlib.Path(os.environ['RUNNER_TEMP'])/'wheel-venv'; launcher=root/('Scripts/mineru.exe' if os.name=='nt' else 'bin/mineru'); subprocess.check_call([str(launcher),'--help'],cwd=os.environ['RUNNER_TEMP'])"
          python -c "import os,pathlib,subprocess; root=pathlib.Path(os.environ['RUNNER_TEMP'])/'wheel-venv'; py=root/('Scripts/python.exe' if os.name=='nt' else 'bin/python'); subprocess.check_call([str(py),'-I','-c','import mineru_rs; assert mineru_rs.canonical_stem(\'a bad/pdf\') == \'a bad_pdf\'; assert mineru_rs.validate_pdf_options(0, None, True, True, True)'],cwd=os.environ['RUNNER_TEMP']); subprocess.check_call([str(py),'-m','unittest','discover','-s',os.path.join(os.environ['GITHUB_WORKSPACE'],'bindings/python/tests'),'-p','test_*.py'],cwd=os.environ['RUNNER_TEMP'])"
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.slot }}
          path: dist/*.whl
          if-no-files-found: error

  node-native:
    needs: identity
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            helper: mineru-office-convert
            node-arch: x64
            suffix: darwin-x64
          - runner: macos-15
            target: aarch64-apple-darwin
            helper: mineru-office-convert
            node-arch: arm64
            suffix: darwin-arm64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            helper: mineru-office-convert
            node-arch: x64
            suffix: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            helper: mineru-office-convert
            node-arch: arm64
            suffix: linux-arm64-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            helper: mineru-office-convert.exe
            node-arch: x64
            suffix: win32-x64-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            helper: mineru-office-convert.exe
            node-arch: arm64
            suffix: win32-arm64-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python for artifact checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Set up Node 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          architecture: ${{ matrix.node-arch }}
      - name: Install npm 12.0.2 and dependencies
        working-directory: bindings/node
        run: npm install --global npm@12.0.2 && npm --version && npm ci
      - name: Install Rust 1.89.0 target
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0 && rustup target add ${{ matrix.target }}
      - name: Build same-target Office helper
        run: cargo build --locked --release --bin mineru-office-convert --features office --target ${{ matrix.target }}
      - name: Build generated addon
        working-directory: bindings/node
        run: |
          npx --no-install napi build --release --platform --target ${{ matrix.target }} -- --locked
          git restore --source=HEAD -- index.js
      - name: Stage and inspect current-build platform package
        run: |
          python .github/scripts/stage_binding_artifacts.py stage-npm --target ${{ matrix.target }} --addon bindings/node/mineru.${{ matrix.suffix }}.node --helper target/${{ matrix.target }}/release/${{ matrix.helper }} --package-dir bindings/node/staged/${{ matrix.suffix }} --root-package-json bindings/node/package.json
          python .github/scripts/stage_binding_artifacts.py inspect-npm --target ${{ matrix.target }} --package-dir bindings/node/staged/${{ matrix.suffix }} --root-package-json bindings/node/package.json
          python -c "from pathlib import Path; import shutil; source=Path('bindings/node/staged/${{ matrix.suffix }}'); destination=Path('bindings/node/node_modules/@alexsun-top/mineru-${{ matrix.suffix }}'); shutil.rmtree(destination, ignore_errors=True); destination.parent.mkdir(parents=True, exist_ok=True); shutil.copytree(source, destination); Path('bindings/node/mineru.${{ matrix.suffix }}.node').unlink()"
      - name: Smoke current-build platform package
        working-directory: bindings/node
        env:
          MINERU_RUN_OFFICE_E2E: "1"
        run: npm test
      - name: Verify checked-in generated types
        if: matrix.suffix == 'linux-x64-gnu'
        working-directory: bindings/node
        run: git diff --exit-code -- index.d.ts
      - name: Verify exact native artifact
        run: python .github/scripts/verify_release.py node-native --directory bindings/node/staged/${{ matrix.suffix }} --suffix ${{ matrix.suffix }}
      - name: Pack current-build platform and root tarballs
        working-directory: bindings/node
        run: |
          python -c "from pathlib import Path; Path('platform-tarball').mkdir(parents=True, exist_ok=False)"
          npm pack "./staged/${{ matrix.suffix }}" --pack-destination platform-tarball --ignore-scripts
          python -c "from pathlib import Path; files=list(Path('platform-tarball').glob('*.tgz')); expected='alexsun-top-mineru-${{ matrix.suffix }}-${{ needs.identity.outputs.version }}.tgz'; assert len(files) == 1 and files[0].name == expected, ([p.name for p in files], expected)"
          python -c "from pathlib import Path; Path('root-tarball').mkdir(parents=True, exist_ok=False)"
          npm pack . --pack-destination root-tarball --ignore-scripts
          python -c "from pathlib import Path; files=list(Path('root-tarball').glob('*.tgz')); expected='alexsun-top-mineru-${{ needs.identity.outputs.version }}.tgz'; assert len(files) == 1 and files[0].name == expected, ([p.name for p in files], expected)"
      - name: Install both tarballs in a fresh project
        run: |
          python -c "import json,os; from pathlib import Path; root=Path(os.environ['RUNNER_TEMP'])/'node-packed-smoke'; root.mkdir(parents=True,exist_ok=False); (root/'package.json').write_text(json.dumps({'name':'mineru-packed-smoke','private':True})+'\n')"
          npm install --prefix "${{ runner.temp }}/node-packed-smoke" --ignore-scripts --package-lock=false --omit=optional --no-audit --no-fund "${{ github.workspace }}/bindings/node/root-tarball/alexsun-top-mineru-${{ needs.identity.outputs.version }}.tgz" "${{ github.workspace }}/bindings/node/platform-tarball/alexsun-top-mineru-${{ matrix.suffix }}-${{ needs.identity.outputs.version }}.tgz"
      - name: Smoke installed launcher
        if: runner.os != 'Windows'
        run: '"${{ runner.temp }}/node-packed-smoke/node_modules/.bin/mineru" --help'
      - name: Smoke installed launcher on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "${{ runner.temp }}/node-packed-smoke/node_modules/.bin/mineru.cmd" --help'
      - name: Smoke installed API and Office conversion
        working-directory: ${{ runner.temp }}/node-packed-smoke
        env:
          MINERU_RUN_OFFICE_E2E: "1"
          MINERU_NODE_TEST_SOURCE: ${{ github.workspace }}/bindings/node/__test__/smoke.test.js
        run: |
          node -e "const api=require('@alexsun-top/mineru');if(api.canonicalStem('a bad/pdf')!=='a bad_pdf'||!api.validatePdfOptions(0,null,true,true,true))process.exit(1)"
          node -e "const fs=require('fs'),Module=require('module'),path=require('path');const root=path.dirname(require.resolve('@alexsun-top/mineru/package.json'));const file=path.join(root,'__test__','smoke.test.js');const test=new Module(file);test.filename=file;test.paths=Module._nodeModulePaths(path.dirname(file));test._compile(fs.readFileSync(process.env.MINERU_NODE_TEST_SOURCE,'utf8'),file)"
      - name: Set up minimum Node runtime
        if: matrix.suffix == 'linux-x64-gnu'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.8
          architecture: x64
      - name: Smoke Linux x64 under Node 18.20.8
        if: matrix.suffix == 'linux-x64-gnu'
        working-directory: bindings/node
        run: node __test__/smoke.test.js
      - name: Upload exact platform tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-platform-${{ matrix.suffix }}
          path: bindings/node/platform-tarball/*.tgz
          if-no-files-found: error

  node-package:
    needs: [identity, node-native]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Set up Node 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          architecture: x64
      - name: Install npm 12.0.2 and dependencies
        working-directory: bindings/node
        run: npm install --global npm@12.0.2 && npm --version && npm ci
      - name: Download all six platform tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: node-platform-*
          path: bindings/node/packed
          merge-multiple: true
      - name: Verify six platform tarballs and pack root
        working-directory: bindings/node
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          python -c "import os; from pathlib import Path; suffixes={'darwin-x64','darwin-arm64','linux-x64-gnu','linux-arm64-gnu','win32-x64-msvc','win32-arm64-msvc'}; version=os.environ['VERSION']; expected={f'alexsun-top-mineru-{s}-{version}.tgz' for s in suffixes}; actual={p.name for p in Path('packed').glob('*.tgz')}; assert actual == expected, (sorted(actual), sorted(expected))"
          node <<'NODE'
          const fs = require('fs')
          const suffixes = ['darwin-x64', 'darwin-arm64', 'linux-x64-gnu', 'linux-arm64-gnu', 'win32-x64-msvc', 'win32-arm64-msvc']
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          manifest.optionalDependencies = Object.fromEntries(suffixes.map(suffix => [`@alexsun-top/mineru-${suffix}`, process.env.VERSION]))
          fs.writeFileSync('package.json', `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          npm pack . --pack-destination packed --ignore-scripts
          python ../../.github/scripts/verify_release.py npm --directory packed --version "$VERSION"
      - name: Upload seven npm tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-packages
          path: bindings/node/packed/*.tgz
          if-no-files-found: error

  build-binary:
    needs: identity
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            helper: mineru-office-convert
            deployment: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            helper: mineru-office-convert
            deployment: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            helper: mineru-office-convert
            deployment: "10.12"
          - runner: macos-15
            target: aarch64-apple-darwin
            helper: mineru-office-convert
            deployment: "11.0"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            helper: mineru-office-convert.exe
            deployment: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            helper: mineru-office-convert.exe
            deployment: ""
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python for archive verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Build Linux binaries in the pinned native builder
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e TARGET="${{ matrix.target }}" \
            rust:1.89.0-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff \
            sh -ec '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc fonts-dejavu-core
              rm -rf /var/lib/apt/lists/*
              install -d -m 700 -o "$HOST_UID" -g "$HOST_GID" /tmp/mineru-home /tmp/mineru-cargo
              install -d -m 755 -o "$HOST_UID" -g "$HOST_GID" /workspace/target
              export HOME=/tmp/mineru-home CARGO_HOME=/tmp/mineru-cargo
              setpriv --reuid="$HOST_UID" --regid="$HOST_GID" --clear-groups cargo build --locked --release -p mineru --features office --bins --target "$TARGET"
              setpriv --reuid="$HOST_UID" --regid="$HOST_GID" --clear-groups cargo test --locked --release -p mineru --features office --target "$TARGET" --test office_convert_helper -- --exact helper_converts_self_authored_docx_pptx_and_xlsx --ignored --test-threads=1
              chmod -R a+rX "/workspace/target/$TARGET/release"
              cd "/workspace/target/$TARGET/release"
              for binary in mineru mineru-api mineru-office-convert; do
                test -f "$binary" && test -x "$binary" && test ! -L "$binary"
              done
              test "$(find . -maxdepth 1 -type f -perm -u+x | wc -l)" -eq 3
              tar -czf "/workspace/container-binaries-$TARGET.tar.gz" mineru mineru-api mineru-office-convert
              chown "$HOST_UID:$HOST_GID" "/workspace/container-binaries-$TARGET.tar.gz"
              chmod 644 "/workspace/container-binaries-$TARGET.tar.gz"
            '
      - name: Build native binaries
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0
          rustup target add ${{ matrix.target }}
          cargo build --locked --release -p mineru --features office --bin mineru --bin mineru-office-convert --target ${{ matrix.target }}
      - name: Validate packaged binaries and Office helper E2E
        shell: bash
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release"
          test "$("$bin/mineru${{ runner.os == 'Windows' && '.exe' || '' }}" --version)" = "mineru $VERSION"
          "$bin/mineru${{ runner.os == 'Windows' && '.exe' || '' }}" --help >/dev/null
          if [ "${{ runner.os }}" != Linux ]; then
            cargo test --locked --release -p mineru --features office --target ${{ matrix.target }} --test office_convert_helper -- --exact helper_converts_self_authored_docx_pptx_and_xlsx --ignored --test-threads=1
          fi
          if [ "${{ runner.os }}" == Linux ]; then
            for binary in mineru mineru-api mineru-office-convert; do
              test -f "$bin/$binary" && test -x "$bin/$binary" && test ! -L "$bin/$binary"
            done
            test "$("$bin/mineru" --version)" = "mineru $VERSION"
            "$bin/mineru" --help >/dev/null
            "$bin/mineru-api" --help >/dev/null
            # mineru-office-convert has no --help; the container E2E and executable checks cover it.
            test "$(find "$bin" -maxdepth 1 -type f -perm -u+x | wc -l)" -eq 3
          fi
          mkdir binary-archive
          python .github/scripts/verify_release.py binary-archive --target ${{ matrix.target }} --version "$VERSION" \
            --mineru "$bin/mineru${{ runner.os == 'Windows' && '.exe' || '' }}" --helper "$bin/${{ matrix.helper }}" --output-directory binary-archive
      - name: Upload Linux container binaries
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-binaries-${{ matrix.target }}
          path: container-binaries-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload exact binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.target }}
          path: binary-archive/*
          if-no-files-found: error

  verify-binary-assets:
    needs: [identity, build-binary]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Download and merge six binary archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-*
          path: binary-input
          merge-multiple: true
      - name: Verify and seal the exact binary asset set
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          python .github/scripts/verify_release.py binary-set --directory binary-input --version "$VERSION"
          python .github/scripts/attach_release_assets.py stage --version "$VERSION" --source binary-input --destination "$RUNNER_TEMP/verified-binary-assets"
          python .github/scripts/attach_release_assets.py seal --version "$VERSION" --directory "$RUNNER_TEMP/verified-binary-assets"
      - name: Upload sealed binary-only release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-binary-assets
          path: ${{ runner.temp }}/verified-binary-assets/*
          if-no-files-found: error

  release-ready:
    needs: [identity, crate-package, python-wheel, node-package]
    runs-on: ubuntu-24.04
    outputs:
      recovery-run-id: ${{ steps.registry-recovery.outputs.run-id }}
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Select one-shot registry recovery
        id: registry-recovery
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          run_id="$(python .github/scripts/verify_release.py registry-recovery --version "$VERSION" --commit "$COMMIT")"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download crate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-package
          path: release-artifacts/crate
      - name: Download all five wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-wheel-*
          path: release-artifacts/wheels
          merge-multiple: true
      - name: Download seven npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-packages
          path: release-artifacts/npm
      - name: Independently verify complete release set
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          python .github/scripts/verify_release.py crate --directory release-artifacts/crate --version "$VERSION"
          python .github/scripts/verify_release.py wheel --directory release-artifacts/wheels --version "$VERSION" --count 5 --platform all
          python .github/scripts/verify_release.py npm --directory release-artifacts/npm --version "$VERSION"
      - name: Seal verified crate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-crate
          path: release-artifacts/crate/*.crate
          if-no-files-found: error
      - name: Seal verified wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-wheels
          path: release-artifacts/wheels/*.whl
          if-no-files-found: error
      - name: Seal verified npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-npm
          path: release-artifacts/npm/*.tgz
          if-no-files-found: error

  publish-crate:
    needs: [identity, release-ready, require-ci-evidence]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Install Rust 1.89.0
        run: rustup toolchain install 1.89.0 --profile minimal && rustup default 1.89.0
      - name: Download verified reference crate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-crate
          path: ${{ runner.temp }}/reference-crate
      - name: Recreate, compare, test, and dry-run before authentication
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          cargo package -p mineru --locked
          python .github/scripts/verify_release.py crate --directory target/package --version "$VERSION" \
            --compare "$RUNNER_TEMP/reference-crate/mineru-$VERSION.crate" --extract "$RUNNER_TEMP/publish-unpacked"
          cargo test --manifest-path "$RUNNER_TEMP/publish-unpacked/mineru-$VERSION/Cargo.toml" --lib --locked -- --test-threads=1
          cargo publish -p mineru --locked --dry-run
      - name: Determine whether crates.io publish is required
        id: crate-preflight
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          publish="$(python .github/scripts/verify_release.py crate-preflight --crate "target/package/mineru-$VERSION.crate" --version "$VERSION" --commit "$COMMIT")"
          test "$publish" = true || test "$publish" = false
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Acquire ephemeral crates.io credential
        id: crates-auth
        if: steps.crate-preflight.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate from immutable source
        if: steps.crate-preflight.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish -p mineru --locked
      - name: Verify exact crates.io release
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
        run: python .github/scripts/verify_release.py crate-postflight --crate "target/package/mineru-$VERSION.crate" --version "$VERSION" --commit "$COMMIT"

  publish-python:
    needs: [identity, release-ready, require-ci-evidence]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Download exact verified wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-wheels
          path: dist
      - name: Download exact first-publish wheel witnesses
        if: needs.release-ready.outputs.recovery-run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-wheels
          path: ${{ runner.temp }}/registry-witness/wheels
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-ready.outputs.recovery-run-id }}
      - name: Select exact wheel bytes
        id: python-packages
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          RECOVERY_RUN_ID: ${{ needs.release-ready.outputs.recovery-run-id }}
        run: |
          set -euo pipefail
          directory="$GITHUB_WORKSPACE/dist"
          if [ -n "$RECOVERY_RUN_ID" ]; then
            directory="$RUNNER_TEMP/registry-witness/wheels"
            python .github/scripts/verify_release.py wheel --directory "$directory" --version "$VERSION" --count 5 --platform all
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - name: Verify PyPI state and select missing wheels
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          DIRECTORY: ${{ steps.python-packages.outputs.directory }}
        run: python .github/scripts/verify_release.py pypi-preflight --project mineru-rs --version "$VERSION" --directory "$DIRECTORY" --missing-directory "$RUNNER_TEMP/pypi-missing"
      - name: Detect missing wheels
        id: pypi-missing
        run: python -c "import os; from pathlib import Path; files=list((Path(os.environ['RUNNER_TEMP'])/'pypi-missing').glob('*.whl')); assert all(path.is_file() and not path.is_symlink() for path in files); Path(os.environ['GITHUB_OUTPUT']).open('a').write(f'has-wheels={str(bool(files)).lower()}\n')"
      - name: Publish missing wheels
        if: steps.pypi-missing.outputs.has-wheels == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: ${{ runner.temp }}/pypi-missing
          skip-existing: 'true'
      - name: Verify exact PyPI release
        if: always()
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          DIRECTORY: ${{ steps.python-packages.outputs.directory }}
        run: python .github/scripts/verify_release.py pypi-postflight --project mineru-rs --version "$VERSION" --directory "$DIRECTORY"

  publish-node:
    needs: [identity, release-ready, require-ci-evidence]
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Node 24.18.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          architecture: x64
      - name: Install npm 12.0.2
        run: npm install --global npm@12.0.2 && npm --version
      - name: Download exact verified npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-npm
          path: packages
      - name: Download exact first-publish npm witnesses
        if: needs.release-ready.outputs.recovery-run-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-npm
          path: ${{ runner.temp }}/registry-witness/npm
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.release-ready.outputs.recovery-run-id }}
      - name: Select exact npm package bytes
        id: node-packages
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          RECOVERY_RUN_ID: ${{ needs.release-ready.outputs.recovery-run-id }}
        run: |
          set -euo pipefail
          directory="$GITHUB_WORKSPACE/packages"
          if [ -n "$RECOVERY_RUN_ID" ]; then
            directory="$RUNNER_TEMP/registry-witness/npm"
            python3 .github/scripts/verify_release.py npm --directory "$directory" --version "$VERSION"
          fi
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
      - name: Publish native packages, then root
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          PACKAGE_DIRECTORY: ${{ steps.node-packages.outputs.directory }}
        run: |
          set -euo pipefail
          publish_verified() {
            package="$1"
            tarball="$2"
            local_integrity="$(node -e "const c=require('crypto'),f=require('fs');process.stdout.write('sha512-'+c.createHash('sha512').update(f.readFileSync(process.argv[1])).digest('base64'))" "$tarball")"
            error_file="$RUNNER_TEMP/npm-view-error"
            if remote_integrity="$(npm view "$package@$VERSION" dist.integrity 2>"$error_file")"; then
              if [ "$remote_integrity" != "$local_integrity" ]; then
                echo "integrity mismatch for $package@$VERSION" >&2
                return 1
              fi
              echo "$package@$VERSION already published with matching integrity"
            else
              status="$?"
              if node -e "const f=require('fs');process.exit(/(^|\\s)E404(\\s|$)/m.test(f.readFileSync(process.argv[1],'utf8'))?0:1)" "$error_file"; then
                npm publish "$tarball" --access public
              else
                node -e "const f=require('fs');process.stderr.write(f.readFileSync(process.argv[1]))" "$error_file"
                return "$status"
              fi
            fi
          }
          for suffix in darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu win32-x64-msvc win32-arm64-msvc; do
            publish_verified "@alexsun-top/mineru-$suffix" "$PACKAGE_DIRECTORY/alexsun-top-mineru-$suffix-$VERSION.tgz"
          done
          publish_verified "@alexsun-top/mineru" "$PACKAGE_DIRECTORY/alexsun-top-mineru-$VERSION.tgz"

  publish-container:
    needs: [identity, build-binary, release-ready, require-ci-evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: ghcr
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/agentsyaml/mineru-cli
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.identity.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.identity.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.identity.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ needs.identity.outputs.commit }}
      - name: Download exact amd64 container binary archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-binaries-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/container-binaries/amd64
      - name: Download exact arm64 container binary archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: container-binaries-aarch64-unknown-linux-gnu
          path: ${{ runner.temp }}/container-binaries/arm64
      - name: Extract and verify Linux container binaries
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY'
          import os
          import pathlib
          import sys
          import tarfile

          expected = {"mineru", "mineru-api", "mineru-office-convert"}
          root = pathlib.Path.cwd()
          run_temp = pathlib.Path(sys.argv[1])
          for slot, target in (("amd64", "x86_64-unknown-linux-gnu"), ("arm64", "aarch64-unknown-linux-gnu")):
              archive = run_temp / "container-binaries" / slot / f"container-binaries-{target}.tar.gz"
              if archive.is_symlink() or not archive.is_file():
                  raise SystemExit(f"container binary archive is not a real file: {archive}")
              destination = root / "container-binaries" / slot
              destination.mkdir(parents=True, exist_ok=False)
              with tarfile.open(archive, "r:gz") as tar:
                  members = tar.getmembers()
                  names = []
                  for member in members:
                      pure = pathlib.PurePosixPath(member.name)
                      if pure.is_absolute() or ".." in pure.parts or len(pure.parts) != 1:
                          raise SystemExit(f"unsafe container tar member {member.name!r}")
                      if member.issym() or member.islnk() or not member.isfile():
                          raise SystemExit(f"unexpected container tar member {member.name!r}")
                      names.append(pure.as_posix())
                  if len(names) != len(expected) or set(names) != expected:
                      raise SystemExit(f"container archive {archive} has wrong members: {sorted(names)}")
                  for member in members:
                      stream = tar.extractfile(member)
                      if stream is None:
                          raise SystemExit(f"cannot read container tar member {member.name!r}")
                      path = destination / member.name
                      path.write_bytes(stream.read())
                      os.chmod(path, 0o755)
              for name in sorted(expected):
                  path = destination / name
                  if path.is_symlink() or not path.is_file() or not (path.stat().st_mode & 0o100):
                      raise SystemExit(f"container binary {path} is not a real executable")
              if sorted(p.name for p in destination.iterdir()) != sorted(expected):
                  raise SystemExit(f"container binaries directory has extras: {sorted(p.name for p in destination.iterdir())}")
          PY
      - name: Build and push multi-platform image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-container
          cache-to: type=gha,mode=max,scope=release-container
      - name: Verify pushed manifest index
        id: container-manifest
        env:
          IMAGE: ghcr.io/agentsyaml/mineru-cli
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > "$RUNNER_TEMP/ghcr-manifest.json"
          python3 .github/scripts/verify_container_release.py manifest --digest "$DIGEST" --file "$RUNNER_TEMP/ghcr-manifest.json" | tee "$RUNNER_TEMP/ghcr-manifest-summary.txt"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          {
            echo "### GHCR manifest"
            echo "\`$IMAGE@$DIGEST\`"
            cat "$RUNNER_TEMP/ghcr-manifest-summary.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify stable tags resolve to pushed digest
        env:
          IMAGE: ghcr.io/agentsyaml/mineru-cli
          DIGEST: ${{ steps.container-manifest.outputs.digest }}
          RELEASE_TAG: v${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.meta.outputs.tags }}' > "$RUNNER_TEMP/ghcr-tags.txt"
          python3 .github/scripts/verify_container_release.py tags --digest "$DIGEST" --image "$IMAGE" --release-tag "$RELEASE_TAG" --tags-file "$RUNNER_TEMP/ghcr-tags.txt" | tee "$RUNNER_TEMP/ghcr-tags-summary.txt"
          {
            echo "### GHCR stable tags"
            cat "$RUNNER_TEMP/ghcr-tags-summary.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pull and smoke each immutable platform image
        env:
          IMAGE: ghcr.io/agentsyaml/mineru-cli
          DIGEST: ${{ steps.container-manifest.outputs.digest }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#linux/}"
            child_digest="$(jq -er --arg architecture "$architecture" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest]
              | if length == 1 then .[0] else error("expected exactly one runtime child manifest") end
            ' "$RUNNER_TEMP/ghcr-manifest.json")"
            docker pull --platform "$platform" "$IMAGE@$child_digest"
            docker run --rm --platform "$platform" --entrypoint /bin/sh "$IMAGE@$child_digest" -ec '
              test "$(id -u)" -ne 0
              for binary in mineru mineru-api mineru-office-convert; do
                test -x "/usr/local/bin/$binary"
              done
              mineru --version
              mineru-api --help >/dev/null
            '
            echo "- \`$platform\` (\`$child_digest\`): non-root API and CLI smoke passed" >> "$GITHUB_STEP_SUMMARY"
          done

  require-ci-evidence:
    needs: identity
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful push CI for the exact protected-main commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&status=completed&head_sha=$COMMIT&branch=main&per_page=100" > "$RUNNER_TEMP/ci-runs.json"
          python3 - "$RUNNER_TEMP/ci-runs.json" "$COMMIT" <<'PY'
          import json
          import sys

          runs = json.load(open(sys.argv[1], encoding="utf-8"))["workflow_runs"]
          assert any(
              run["event"] == "push"
              and run["head_sha"] == sys.argv[2]
              and run["head_branch"] == "main"
              and run["status"] == "completed"
              and run["conclusion"] == "success"
              for run in runs
          ), f"no successful push CI run for main at {sys.argv[2]}"
          PY

  publish-release:
    needs: [identity, verify-binary-assets, require-ci-evidence, publish-crate, publish-python, publish-node, publish-container]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.6
      - name: Download sealed binary-only release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-binary-assets
          path: release-assets
      - name: Re-verify sealed binary-only assets
        env:
          VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/archive-only"
          cp release-assets/mineru-v"$VERSION"-* "$RUNNER_TEMP/archive-only/"
          python .github/scripts/verify_release.py binary-set --directory "$RUNNER_TEMP/archive-only" --version "$VERSION"
      - name: Create, attach, verify, and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_id=''
          published=false
          cleanup() {
            status=$?
            if test "$status" -ne 0 && test -n "$release_id" && test "$published" != true; then
              metadata="$RUNNER_TEMP/release-$release_id.json"
              if ! gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"; then
                echo "draft cleanup could not re-GET release $release_id; preserve it and recover manually" >&2
              elif ! python3 - "$metadata" "$release_id" "$tag" "$COMMIT" <<'PY'
              import json
              import sys

              release = json.load(open(sys.argv[1], encoding="utf-8"))
              assert str(release.get("id")) == sys.argv[2]
              assert release.get("tag_name") == sys.argv[3]
              assert release.get("target_commitish") == sys.argv[4]
              assert release.get("draft") is True
              assert release.get("prerelease") is False
          PY
              then
                echo "release $release_id is not the exact unpublished draft; preserve it and recover manually" >&2
              elif ! gh api --method DELETE "/repos/$GITHUB_REPOSITORY/releases/$release_id"; then
                echo "could not delete exact draft $release_id; recover manually" >&2
              else
                ref="$RUNNER_TEMP/tag-$release_id.json"
                if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > "$ref" 2>/dev/null \
                  && python3 - "$ref" "$COMMIT" <<'PY'
              import json
              import sys

              ref = json.load(open(sys.argv[1], encoding="utf-8"))
              assert ref["object"]["type"] == "commit"
              assert ref["object"]["sha"] == sys.argv[2]
          PY
                then
                  gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                    || echo "exact lightweight tag $tag remains; delete it manually" >&2
                else
                  echo "no exact lightweight tag $tag to clean up; preserving any other tag" >&2
                fi
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          absent() {
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/api-body" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' "$1")"
            test "$status" = 404 || { echo "expected HTTP 404 from $1, got $status" >&2; cat "$RUNNER_TEMP/api-body" >&2; exit 1; }
          }
          absent "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          absent "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag"
          release_id="$(gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$COMMIT" -f name="$tag" -F draft=true -F prerelease=false -F generate_release_notes=true --jq .id)"
          absent "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          python .github/scripts/attach_release_assets.py attach --repository "$GITHUB_REPOSITORY" --release-id "$release_id" --tag "$tag" --commit "$COMMIT" --version "$VERSION" --directory release-assets
          python .github/scripts/attach_release_assets.py verify-release --repository "$GITHUB_REPOSITORY" --release-id "$release_id" --tag "$tag" --commit "$COMMIT" --version "$VERSION" --directory release-assets --draft true
          absent "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          gh api --method PATCH "/repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          published=true
          python .github/scripts/attach_release_assets.py verify-release --repository "$GITHUB_REPOSITORY" --release-id "$release_id" --tag "$tag" --commit "$COMMIT" --version "$VERSION" --directory release-assets --draft false
