x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "3"

# Separate provider-image baseline; docs/compatibility.md's MinerU 3.4.5 is the
# VLM protocol baseline, not a requirement to change this provider image tag.
x-mineru-vllm: &mineru-vllm
  <<: *defaults
  image: ${GLOBAL_REGISTRY:-}alexsuntop/mineru:${MINERU_VERSION:-3.4.2}
  environment:
    TZ: ${TZ:-UTC}
    MINERU_MODEL_SOURCE: local
  ulimits:
    memlock: -1
    stack: 67108864
  ipc: host
  deploy:
    resources:
      limits:
        cpus: ${VLLM_CPU_LIMIT:-4.0}
        memory: ${VLLM_MEMORY_LIMIT:-8G}
      reservations:
        cpus: ${VLLM_CPU_RESERVATION:-0.1}
        memory: ${VLLM_MEMORY_RESERVATION:-4G}
        devices:
          - driver: nvidia
            device_ids: ["${VLLM_NVIDIA_DEVICE_ID:-0}"]
            capabilities: [gpu]

x-llama-vulkan: &llama-vulkan
  image: ${LLAMA_VULKAN_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan}
  ports:
    - "${MINERU_PROVIDER_BIND_HOST:-127.0.0.1}:${MINERU_PORT_OVERRIDE_LLAMA:-30001}:8080"
  volumes:
    - type: bind
      source: ${LLAMA_MODEL_DIR:-./models}
      target: /models
      read_only: true
      bind:
        create_host_path: false
  command:
    - --host
    - 0.0.0.0
    - --port
    - "8080"
    - --model
    - /models/${LLAMA_MODEL_FILE:-model.gguf}
    - --mmproj
    - /models/${LLAMA_MMPROJ_FILE:-mmproj.gguf}
    - --alias
    - ${LLAMA_MODEL_ALIAS:-mineru-vlm}
    - --n-gpu-layers
    - ${LLAMA_GPU_LAYERS:-auto}

services:
  llama-server-vulkan:
    <<: *llama-vulkan
    profiles: [vulkan]
    devices:
      - ${VULKAN_DRI_PATH:-/dev/dri}:/dev/dri
  llama-server-vulkan-nvidia:
    <<: *llama-vulkan
    profiles: [vulkan-nvidia]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VULKAN_NVIDIA_DEVICE_ID:-0}"]
              capabilities: [gpu]
  mineru-openai-server:
    <<: *mineru-vllm
    profiles:
      - openai-server
    ports:
      - "${MINERU_PROVIDER_BIND_HOST:-127.0.0.1}:${MINERU_PORT_OVERRIDE_VLLM:-30000}:30000"
    entrypoint: mineru-openai-server
    command: --host 0.0.0.0
      --port 30000
      --gpu-memory-utilization ${MINERU_GPU_MEMORY_UTILIZATION:-0.5}
      ${MINERU_VLLM_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
