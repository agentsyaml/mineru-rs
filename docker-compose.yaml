x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 100m
      max-file: "3"

# Separate provider-image baseline; docs/compatibility.md's MinerU 3.4.5 is the
# VLM protocol baseline, not a requirement to change this provider image tag.
x-mineru-vllm: &mineru-vllm
  <<: *defaults
  image: ${GLOBAL_REGISTRY:-}alexsuntop/mineru:${MINERU_VERSION:-3.4.2}
  environment:
    TZ: ${TZ:-UTC}
    MINERU_MODEL_SOURCE: local
  ulimits:
    memlock: -1
    stack: 67108864
  ipc: host
  deploy:
    resources:
      limits:
        cpus: ${VLLM_CPU_LIMIT:-4.0}
        memory: ${VLLM_MEMORY_LIMIT:-8G}
      reservations:
        cpus: ${VLLM_CPU_RESERVATION:-0.1}
        memory: ${VLLM_MEMORY_RESERVATION:-4G}
        devices:
          - driver: nvidia
            device_ids: ["${VLLM_NVIDIA_DEVICE_ID:-0}"]
            capabilities: [gpu]

# Generic llama.cpp OpenAI-compatible provider example only; not validated for MinerU 4.0.0a6 multimodal compatibility.
x-mineru-llama: &mineru-llama
  <<: *defaults
  image: ${LLAMA_CPP_REGISTRY:-}ghcr.io/ggml-org/llama.cpp:${LLAMA_CPP_TAG:-server-cuda}
  environment:
    TZ: ${TZ:-UTC}
    LLAMA_ARG_HOST: 0.0.0.0
    LLAMA_ARG_PORT: 30000
    LLAMA_ARG_MODEL: ${LLAMA_MODEL:-/models/model.gguf}
    LLAMA_ARG_CTX_SIZE: ${LLAMA_CTX_SIZE:-8192}
    # Number of layers offloaded to the GPU; use auto/all for full offload.
    LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_N_GPU_LAYERS:-99}
  volumes:
    # Put your quantized GGUF file(s) in ./models (host) or point LLAMA_MODELS_DIR elsewhere.
    - ${LLAMA_MODELS_DIR:-./models}:/models:ro
  ulimits:
    memlock: -1
    stack: 67108864
  ipc: host
  deploy:
    resources:
      limits:
        cpus: ${LLAMA_CPU_LIMIT:-4.0}
        memory: ${LLAMA_MEMORY_LIMIT:-8G}
      reservations:
        cpus: ${LLAMA_CPU_RESERVATION:-0.1}
        memory: ${LLAMA_MEMORY_RESERVATION:-4G}
        devices:
          - driver: nvidia
            device_ids: ["${LLAMA_NVIDIA_DEVICE_ID:-0}"]
            capabilities: [gpu]

services:
  mineru-openai-server:
    <<: *mineru-vllm
    profiles:
      - "openai-server"
      - ${COMPOSE_PROFILES:-} # empty by default: active without an explicit profile
    ports:
      - "${MINERU_PROVIDER_BIND_HOST:-127.0.0.1}:${MINERU_PORT_OVERRIDE_VLLM:-30000}:30000"
    entrypoint: mineru-openai-server
    command: --host 0.0.0.0
      --port 30000
      --gpu-memory-utilization ${MINERU_GPU_MEMORY_UTILIZATION:-0.5}
      ${MINERU_VLLM_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Generic llama.cpp provider example only; not validated for MinerU 4.0.0a6 multimodal compatibility.
  # Set LLAMA_MODEL=/models/<file>.gguf explicitly.
  mineru-llama-server:
    <<: *mineru-llama
    profiles:
      - "llama-server"
      - ${COMPOSE_PROFILES:-} # empty by default: active without an explicit profile
    ports:
      - "${MINERU_PROVIDER_BIND_HOST:-127.0.0.1}:${MINERU_PORT_OVERRIDE_LLAMA:-30000}:30000"
    # The image ships a HEALTHCHECK pinned to its default port 8080; override it
    # when remapping the port so the container is not reported unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
